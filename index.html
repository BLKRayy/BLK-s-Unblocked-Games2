<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unblocked Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader">Loading...</div>

<header>
  <img id="logo" src="YOUR_LOGO_URL_HERE" alt="Logo">
  <h1>Unblocked Games</h1>

  <input type="text" id="search" placeholder="Search games...">

  <select id="category-filter">
    <option value="all">All Categories</option>
    <option value="Arcade">Arcade</option>
    <option value="Sports">Sports</option>
    <option value="Shooting">Shooting</option>
    <option value="Racing">Racing</option>
    <option value="Puzzle">Puzzle</option>
    <option value="Simulation">Simulation</option>
    <option value="Skill">Skill</option>
    <option value="Platformer">Platformer</option>
  </select>

  <button id="show-favorites">⭐ Favorites</button>
  <button id="show-recent">🕒 Recent</button>

  <button id="theme-toggle">🌙</button>

  <a id="admin-link" href="admin.html">Admin</a>
</header>

<main>
  <aside id="game-list"></aside>

  <section id="game-viewer">
    <div id="featured">
      <h2>Featured Games</h2>
      <div id="featured-list"></div>
    </div>

    <h2 id="game-title">Select a game</h2>
    <iframe id="game-frame" src="" frameborder="0"></iframe>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
